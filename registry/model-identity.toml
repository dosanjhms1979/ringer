# Model identity registry — resolves (engine, manifest model field) into the
# display taxonomy: Model / Lab / Harness / Access. This is what the scoreboard and
# Ringside show, and what keeps engine names (codex) from masquerading as
# model names.
#
# confidence: "verified" requires a cited source (see source field);
# "unverified" entries are best current knowledge awaiting the capability
# research pass. Update via PR — this file is loaded into the local read DB.

[engines.codex]
harness = "Codex CLI"
access = "OAuth plan"
# Matches config.toml's model_default, pinned 2026-09-12. Only reached when an
# attempt carries neither a manifest model nor a harness self-report.
default_model_key = "gpt-6-astra"

[engines.codex.models."gpt-5.5"]
display = "GPT-5.5"
lab = "OpenAI"
confidence = "verified"     # snapshot gpt-5.5-2026-04-23, Codex CLI default; see capability file
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-sol"]
display = "GPT-5.6 Sol"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-luna"]
display = "GPT-5.6 Luna"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-5.6-terra"]
display = "GPT-5.6 Terra"
lab = "OpenAI"
confidence = "verified"
source = "https://developers.openai.com/codex/models"
last_verified = 2026-07-10

[engines.codex.models."gpt-6-astra"]
display = "GPT-6 Astra"
lab = "OpenAI"
confidence = "verified"     # Codex CLI self-report `model: gpt-6-astra` in worker logs (AE-22/AE-25, 2026-09-05); docs describe it as "our most capable model for complex work across code, apps, and research"
source = "https://learn.chatgpt.com/docs/models"
last_verified = 2026-09-12

[engines.grok]
harness = "Grok Build CLI"
access = "OAuth plan"
default_model_key = "grok-4.7"

[engines.grok.models."grok-build"]
# "Grok Build" is the HARNESS (the CLI product), never a model name. The CLI
# serves exactly two models: Grok 4.5 (xAI) and Composer 2.5 (Cursor). The
# 'grok-build' engine default resolves to Grok 4.5. An earlier entry here
# wrongly recorded "Grok Build 0.1" as a model — do not reintroduce it.
display = "Grok 4.5"
lab = "xAI"
confidence = "verified"     # operator-confirmed (Jon, 2026-07-10): Grok Build CLI serves Grok 4.5 + Composer 2.5
source = "https://docs.x.ai/developers/release-notes"
last_verified = 2026-07-10
noncanonical_slugs = ["opencode:openrouter/x-ai/grok-4.5"]

[engines.grok.models."grok-composer-2.5-fast"]
display = "Composer 2.5 Fast"
lab = "Cursor (Anysphere)"
confidence = "verified"     # Cursor (Anysphere) model, served through xAI's Grok Build CLI in our setup
source = "https://cursor.com/blog/composer-2-5"
last_verified = 2026-07-10

[engines.grok.models."grok-4.6"]
# Grok Build CLI v1.0.13 `grok models` lists grok-4.6 as the sole available
# model and the default; config.toml pins model_default = "grok-4.6".
# Release notes wording (Aug 2026): "Grok 4.6, SpaceXAI's frontier model for
# coding, agentic tasks, and knowledge work, is now available on the xAI API."
# SpaceXAI is the lab; xAI is the API surface. The grok-4.5 entry above was
# verified 2026-07-10 under the older "xAI" wording and is left as recorded.
display = "Grok 4.6"
lab = "SpaceXAI"
confidence = "verified"
source = "https://docs.x.ai/developers/release-notes"
last_verified = 2026-09-12

[engines.grok.models."grok-4.7"]
# 2026-09-26: after `grok login --device-auth`, Grok Build CLI v1.0.13
# `grok models` lists grok-4.7 as the SOLE available model and the default;
# grok-4.6 is gone from the signed-in listing. config.toml pins
# model_default = "grok-4.7". Worker JSON self-reports "grok-4.7" in
# modelUsage (run grok-4.7-engine-probe). Lab follows the grok-4.6 entry's
# release-notes wording; confidence stays "provisional" until the release
# note for 4.7 is read.
display = "Grok 4.7"
lab = "SpaceXAI"
confidence = "provisional"
source = "https://docs.x.ai/developers/release-notes"
last_verified = 2026-09-26

[engines.opencode]
harness = "OpenCode"
access = "OpenRouter API"
# model key = the manifest "model" slug; entries below map slugs to display
# names. Unlisted slugs are marked unregistered and derive a display name;
# their complete raw value appears only in scoreboard diagnostics until verified.

[engines.opencode.models."openrouter/z-ai/glm-5.2"]
display = "GLM 5.2"
lab = "Z.ai (Zhipu AI)"
